<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>16-Bit-Schalter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: ein Bedienfeld mit 16 Bit-Schaltern (zwei Bytes, je zwei Vierergruppen), darunter der Dezimalwert groß und mittig. */
:root {
  --bg: #EEF2F7;
  --panel: #FFFFFF;
  --off: #E6ECF3;
  --ink: #101C2B;
  --muted: #4A5A6C;
  --line: #B9C6D4;
  --accent: #0B63C5;
  --on-accent: #FFFFFF;
  --focus: #0B63C5;
  --f-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --w: clamp(34px, 4.6vw, 72px);
  --g-bit: clamp(3px, .5vw, 8px);
  --g-nib: clamp(10px, 1.6vw, 26px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1520; --panel: #152131; --off: #1D2C40; --ink: #E8EEF5; --muted: #A3B3C6;
    --line: #34475E; --accent: #6DB6FF; --on-accent: #06121F; --focus: #6DB6FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1520; --panel: #152131; --off: #1D2C40; --ink: #E8EEF5; --muted: #A3B3C6;
  --line: #34475E; --accent: #6DB6FF; --on-accent: #06121F; --focus: #6DB6FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: 17px;
  line-height: 1.5;
  padding-inline: clamp(16px, 4vw, 48px);
  padding-block: clamp(20px, 4vw, 48px);
}
main { max-width: 1500px; margin-inline: auto; display: flex; flex-direction: column; gap: clamp(20px, 3vw, 36px); }

header { display: flex; flex-direction: column; gap: 6px; }
h1 { margin: 0; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.15; font-weight: 600; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 65ch; }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: clamp(16px, 2.5vw, 32px);
}
.bits { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px clamp(28px, 4vw, 56px); }
.byte { display: flex; flex-direction: column; gap: 10px; }
.byte-row { display: flex; gap: var(--g-nib); }
.nib { display: flex; gap: var(--g-bit); }
.cap { border-top: 2px solid var(--line); padding-top: 6px; font-size: 14px; color: var(--muted); text-align: center; }

.bit { display: flex; flex-direction: column; align-items: center; gap: 4px; width: var(--w); }
.exp { font-family: var(--f-mono); font-size: clamp(10px, 1.1vw, 14px); color: var(--muted); line-height: 1.2; }
.exp sup { font-size: .72em; line-height: 0; }
.wert { font-family: var(--f-mono); font-weight: 500; font-size: clamp(10px, 1.35vw, 17px); line-height: 1.2; font-variant-numeric: tabular-nums; }

.b {
  width: var(--w);
  height: calc(var(--w) * 1.3);
  margin-top: 4px;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--off);
  color: var(--muted);
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: calc(var(--w) * .56);
  line-height: 1;
  box-shadow: inset 0 -4px 0 var(--line);
  cursor: pointer;
  touch-action: manipulation;
  transition: background-color .12s, color .12s, border-color .12s, transform .06s;
}
.b.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .22);
}
.b:active { transform: translateY(2px); }
.b:focus-visible, .act:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.readout { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.label { margin: 0; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.value {
  margin: 0;
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: clamp(72px, 14vw, 168px);
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.calc { margin: 0; max-width: 62ch; font-family: var(--f-mono); font-size: clamp(15px, 1.8vw, 22px); color: var(--muted); overflow-wrap: anywhere; min-height: 1.5em; }

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.act {
  font: inherit;
  font-weight: 600;
  min-height: 44px;
  padding: 8px 20px;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}
.act:hover { border-color: var(--accent); }

.note { margin: 0; text-align: center; color: var(--muted); font-size: 15px; }
.note sup { font-size: .72em; line-height: 0; }

@media (prefers-reduced-motion: reduce) {
  .b { transition: none; }
  .b:active { transform: none; }
}
</style>
</head><body>

<main>
  <header>
    <h1>16-Bit-Schalter</h1>
    <p>Klicke auf ein Bit, um es zwischen 0 und 1 umzuschalten. Unten siehst du die Dezimalzahl, die deine Bits ergeben.</p>
  </header>

  <section class="panel" aria-label="16 Bits">
    <div class="bits" id="bits"></div>
  </section>

  <section class="readout" aria-label="Ergebnis">
    <p class="label">Dezimalwert</p>
    <p class="value" id="dec" role="status">0</p>
    <p class="calc" id="calc">Kein Bit gesetzt</p>
  </section>

  <div class="actions">
    <button type="button" class="act" id="allzero">Alle auf 0</button>
    <button type="button" class="act" id="allone">Alle auf 1</button>
  </div>

  <p class="note">Mit 16 Bit lassen sich 2<sup>16</sup> = 65536 Werte darstellen: von 0 bis 65535.</p>
</main>

<script>
(function () {
  var N = 16;
  var state = [];                 // state[e] = Bit mit Stellenwert 2^e
  var btns = [];
  var root = document.getElementById('bits');
  var decEl = document.getElementById('dec');
  var calcEl = document.getElementById('calc');

  for (var i = 0; i < N; i++) state.push(0);

  function mkBit(e) {
    var wrap = document.createElement('div');
    wrap.className = 'bit';
    var ex = document.createElement('span');
    ex.className = 'exp';
    ex.innerHTML = '2<sup>' + e + '</sup>';
    var val = document.createElement('span');
    val.className = 'wert';
    val.textContent = String(Math.pow(2, e));
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'b';
    b.id = 'bit' + e;
    b.addEventListener('click', function () {
      state[e] = state[e] ? 0 : 1;
      render();
    });
    btns[e] = b;
    wrap.appendChild(ex);
    wrap.appendChild(val);
    wrap.appendChild(b);
    return wrap;
  }

  function mkNibble(hi) {
    var n = document.createElement('div');
    n.className = 'nib';
    for (var e = hi; e > hi - 4; e--) n.appendChild(mkBit(e));
    return n;
  }

  function mkByte(hi, caption) {
    var by = document.createElement('div');
    by.className = 'byte';
    var row = document.createElement('div');
    row.className = 'byte-row';
    row.appendChild(mkNibble(hi));
    row.appendChild(mkNibble(hi - 4));
    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = caption;
    by.appendChild(row);
    by.appendChild(cap);
    return by;
  }

  root.appendChild(mkByte(15, 'oberes Byte · Bit 15 bis 8'));
  root.appendChild(mkByte(7, 'unteres Byte · Bit 7 bis 0'));

  function render() {
    var sum = 0, terms = [];
    for (var e = N - 1; e >= 0; e--) {
      var on = state[e] === 1, w = Math.pow(2, e);
      var b = btns[e];
      b.textContent = on ? '1' : '0';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('aria-label', 'Bit ' + e + ', Stellenwert ' + w + ': ' + (on ? '1' : '0'));
      b.classList.toggle('on', on);
      if (on) { sum += w; terms.push(w); }
    }
    decEl.textContent = String(sum);
    calcEl.textContent = terms.length ? terms.join(' + ') : 'Kein Bit gesetzt';
  }

  document.getElementById('allzero').addEventListener('click', function () {
    for (var e = 0; e < N; e++) state[e] = 0;
    render();
  });
  document.getElementById('allone').addEventListener('click', function () {
    for (var e = 0; e < N; e++) state[e] = 1;
    render();
  });

  render();
})();
</script>
</body></html>
